name: Update Docs

on:
  push:
    branches: [master]

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: "gh-pages"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deid
        run: |
          root=$PWD
          cd /tmp
          git clone https://github.com/pydicom/deid
          cd deid
          pip install -e .
          pip install deid-data
          cd ./docs
          pip install -r api_docs/docs-requirements.txt
          /bin/bash ./apidoc.sh
          cd ../
          mv $root/.git ./docs/api_docs/.git
          rm -rf $root
          mv ./docs/api_docs $root
          cd $root
          ls -a
          git add .
          git status
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global pull.rebase true

          if git diff-index --quiet HEAD --; then
             printf "No changes\n"
          else
             printf "Changes\n"
             git commit -a -m "Adding changed documentation files"
             git push origin gh-pages || echo "up to date"
          fi
